name: Feature request / 功能建议
description: Describe the problem you want to solve. English or Chinese is welcome.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs / 替代方案及取舍
  - type: markdown
    attributes:
      value: Please avoid including private browsing data. A request is a starting point for discussion, not a delivery commitment.
